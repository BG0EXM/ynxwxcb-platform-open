# 伊宁县委宣传部部务工作平台 - Nginx HTTPS 配置
# 放到 /etc/nginx/sites-available/ynxwxcb.conf（该目录在 nginx.conf 的 http {} 块内被 include）
# 替换 your-domain.com 和证书路径
#
# 配合后端 config.json：
#   "server": { "host": "127.0.0.1", "trust_proxy": true }
#   后端只监听本机回环地址，外部无法绕过 Nginx 直连 8080；
#   trust_proxy=true 时后端优先取 X-Real-IP 作为客户端真实 IP（用于登录限流与操作日志）。

# WebSocket 升级头映射（有 Upgrade 请求头时传 upgrade，否则传 close）
# 变量名带 ynxwxcb_ 前缀，避免与服务器上其他站点已定义的 $connection_upgrade 重名报错
map $http_upgrade $ynxwxcb_connection_upgrade {
    default upgrade;
    ''      close;
}

# 缓存策略（默认值）：/assets/ 下为带哈希指纹的构建产物，长期缓存；
# 其余（index.html / SPA 路由 / 接口 / 附件）一律 no-cache，确保升级后浏览器立即加载新版页面
map $uri $ynxwxcb_cache_default {
    ~^/assets/  "public, max-age=604800, immutable";
    default     "no-cache";
}

# 后端优先：后端响应自带 Cache-Control（如接口 no-store）时以后端为准，Nginx 不再追加，
# 只有后端没设置时才补上上面的默认值，避免浏览器收到两条互相矛盾的 Cache-Control
# （add_header 的值为空字符串时 Nginx 不会输出该响应头）
map $upstream_http_cache_control $ynxwxcb_cache_control {
    ""          $ynxwxcb_cache_default;
    default     "";
}

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com;
    # HTTP 自动跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    # HTTP/2 写法二选一（按 nginx -v 显示的版本）：
    #   nginx < 1.25.1（Debian 12 / Ubuntu 24.04 及更早系统自带版本）：用下面两行 "listen ... ssl http2;"（默认）
    #   nginx >= 1.25.1：可改为 "listen 443 ssl;" + "listen [::]:443 ssl;" 并另起一行 "http2 on;"
    #   （新版仍兼容旧写法，仅提示 deprecated 警告）
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com;

    # 证书路径（请替换为你的证书位置）
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # 客户端上传大小限制（与后端 max_mb 一致）
    client_max_body_size 50m;

    # 响应头统一在 server 级设置（location 内不再写 add_header，避免 Nginx 继承规则把这里的头整体丢掉）
    # HSTS：浏览器 1 年内强制 HTTPS 访问本域名。确认 HTTPS 稳定后再启用 includeSubDomains / preload
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control $ynxwxcb_cache_control always;
    # X-Frame-Options / X-Content-Type-Options / Referrer-Policy / CSP 等安全头已由后端统一下发，此处不再重复添加

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # 客户端真实 IP：X-Real-IP 与 X-Forwarded-For 都只传 Nginx 实际看到的对端地址，
        # 不拼接客户端自带的 X-Forwarded-For，杜绝伪造 IP 绕过登录限流
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        # WebSocket 支持（预留）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ynxwxcb_connection_upgrade;
    }
}
